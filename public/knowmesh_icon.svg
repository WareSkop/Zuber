<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hell-Kalter Hintergrund -->
    <linearGradient id="bgLC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>

    <!-- Schatten für helle Karten -->
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- App-Squircle (Heller Hintergrund) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgLC)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Hintere Karteikarte (schräg) -->
  <g transform="translate(20, -10) rotate(8 256 256)" filter="url(#shadowLight)" opacity="0.6">
    <rect x="120" y="130" width="230" height="270" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <line x1="150" y1="170" x2="230" y2="170" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Vordere weiße Notizkarte -->
  <g filter="url(#shadowLight)">
    <rect x="105" y="125" width="235" height="280" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />

    <!-- Notiz-Titelzeile -->
    <rect x="135" y="160" width="28" height="28" rx="6" fill="#2563eb" />
    <text x="142" y="180" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">#</text>
    <line x1="175" y1="174" x2="295" y2="174" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />

    <!-- Notizzeilen -->
    <line x1="135" y1="215" x2="305" y2="215" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="135" y1="240" x2="275" y2="240" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    
    <!-- [[Wiki-Link]] Chip auf der Notiz -->
    <rect x="135" y="270" width="125" height="30" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="146" y="291" font-family="monospace" font-size="13" font-weight="bold" fill="#2563eb">[[Vault]]</text>
  </g>

  <!-- Kobaltblauer Wissensgraph (tritt aus der Karte hervor) -->
  <g stroke-linecap="round">
    <!-- Hauptpfad vom Chip nach Rechtsaußen -->
    <path d="M 260 285 C 310 285, 320 220, 365 210" fill="none" stroke="#2563eb" stroke-width="4.5" />
    <line x1="365" y1="210" x2="415" y2="150" stroke="#0284c7" stroke-width="3.5" />
    <line x1="365" y1="210" x2="410" y2="300" stroke="#0284c7" stroke-width="3.5" />
    
    <!-- Sekundäre Verknüpfung -->
    <path d="M 305 174 C 350 174, 380 160, 415 150" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Datenknoten im hellen Raum -->
  <circle cx="260" cy="285" r="5" fill="#2563eb" />

  <!-- Zentraler Knoten (Kobaltblau mit weißem Ring) -->
  <circle cx="365" cy="210" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="4.5" />
  <circle cx="365" cy="210" r="7" fill="#2563eb" />

  <!-- Satelliten-Knoten -->
  <circle cx="415" cy="150" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="3.5" />
  <circle cx="415" cy="150" r="4.5" fill="#0284c7" />

  <circle cx="410" cy="300" r="12" fill="#ffffff" stroke="#0284c7" stroke-width="3.5" />
  <circle cx="410" cy="300" r="4.5" fill="#0284c7" />
</svg>