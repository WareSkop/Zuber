services:
  zuber:
    image: ghcr.io/wareskop/zuber:latest
    container_name: zuber
    restart: unless-stopped
    ports:
      - "3443:3443"
    environment:
      - NODE_ENV=production
      - PORT=3443
      - ENABLE_HTTPS=false
      - TRUST_PROXY=true
      - FORCE_AUTH=true
      - VAULT_DIR=/data/vault
      - CONFIG_PATH=/data/config/server-config.json
      - PASSWORD=secret_password
      - SESSION_SECRET=loooooong_secret_password_even_longer_than this
      - MAX_UPLOAD_MB=100
      # - ALLOWED_ORIGINS=https://zuber.example.com
    volumes:
      - ./vault:/data/vault
      - ./config:/data/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- http://127.0.0.1:3443/api/auth/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
