<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="bgFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>

    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>

    <linearGradient id="facetMidDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14171e"/>
      <stop offset="100%" stop-color="#242b37"/>
    </linearGradient>

    <linearGradient id="facetMid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a3242"/>
      <stop offset="100%" stop-color="#191e26"/>
    </linearGradient>

    <linearGradient id="facetSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303949"/>
      <stop offset="100%" stop-color="#1d222c"/>
    </linearGradient>

    <linearGradient id="facetHighlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c4656"/>
      <stop offset="100%" stop-color="#202630"/>
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe48f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a671d"/>
    </linearGradient>

    <linearGradient id="goldWarm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c2e"/>
      <stop offset="60%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#fff2bd"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3d179"/>
      <stop offset="50%" stop-color="#b8862d"/>
      <stop offset="100%" stop-color="#5a4114"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddbd9"/>
      <stop offset="100%" stop-color="#0d3f4a"/>
    </linearGradient>
  </defs>

  <!-- ================= BOOK BACKDROP PLATE ================= -->
  <polygon points="50,175 750,175 750,670 50,670" fill="#090b0e"/>

  <!-- ================= BACKGROUND BASE & OUTER FRAME ================= -->
  <g id="outerFrame">
    <!-- Bottom horizontal border -->
    <polygon points="50,660 750,660 735,705 65,705" fill="url(#bgFrame)" stroke="#06070a" stroke-width="2"/>
    <line x1="65" y1="660" x2="735" y2="660" stroke="#1f242e" stroke-width="1.5"/>

    <!-- Left Outer Cover / Slabs -->
    <polygon points="50,175 85,175 85,660 50,660" fill="#0e1116" stroke="#06070a" stroke-width="2"/>
    <polygon points="50,175 85,175 68,230 50,230" fill="#1e232d"/>
    <polygon points="50,660 85,660 68,610 50,610" fill="#161922"/>
    <line x1="50" y1="175" x2="50" y2="660" stroke="#252c38" stroke-width="1.5"/>

    <!-- Middle left slab -->
    <polygon points="85,145 118,145 118,655 85,655" fill="#13171f" stroke="#080a0d" stroke-width="1.5"/>
    <line x1="85" y1="145" x2="85" y2="655" stroke="url(#goldEdge)" stroke-width="2.2"/>

    <!-- Inner left stack backing -->
    <polygon points="118,115 145,115 145,645 118,645" fill="#181c25" stroke="#080a0d" stroke-width="1.5"/>
    <line x1="118" y1="115" x2="118" y2="645" stroke="#2c3444" stroke-width="1"/>

    <!-- Right Outer Cover / Slabs (Mirrored) -->
    <polygon points="750,175 715,175 715,660 750,660" fill="#0e1116" stroke="#06070a" stroke-width="2"/>
    <polygon points="750,175 715,175 732,230 750,230" fill="#161922"/>
    <polygon points="750,660 715,660 732,610 750,610" fill="#1e232d"/>
    <line x1="750" y1="175" x2="750" y2="660" stroke="#252c38" stroke-width="1.5"/>

    <!-- Middle right slab -->
    <polygon points="715,145 682,145 682,655 715,655" fill="#13171f" stroke="#080a0d" stroke-width="1.5"/>
    <line x1="715" y1="145" x2="715" y2="655" stroke="url(#goldEdge)" stroke-width="2.2"/>

    <!-- Inner right stack backing -->
    <polygon points="682,115 655,115 655,645 682,645" fill="#181c25" stroke="#080a0d" stroke-width="1.5"/>
    <line x1="682" y1="115" x2="682" y2="645" stroke="#2c3444" stroke-width="1"/>
  </g>

  <!-- ================= LOWER BOOK BLOCK / FANNED PAGES ================= -->
  <g id="bottomPageFan">
    <!-- Under-page fan body -->
    <polygon points="118,580 400,640 682,580 682,655 400,695 118,655" fill="#0d1015"/>

    <!-- Left lower fanning pages -->
    <polygon points="118,585 400,645 400,658 118,602" fill="#151922"/>
    <polygon points="118,605 400,660 400,672 118,622" fill="#1c212a"/>
    <polygon points="118,625 400,674 400,685 118,642" fill="#11141a"/>

    <!-- Right lower fanning pages -->
    <polygon points="682,585 400,645 400,658 682,602" fill="#151922"/>
    <polygon points="682,605 400,660 400,672 682,622" fill="#1c212a"/>
    <polygon points="682,625 400,674 400,685 682,642" fill="#11141a"/>

    <!-- Radiating page ribs / gold leaf strata -->
    <line x1="400" y1="645" x2="118" y2="585" stroke="url(#goldWarm)" stroke-width="2"/>
    <line x1="400" y1="658" x2="118" y2="602" stroke="#323b4c" stroke-width="1.2"/>
    <line x1="400" y1="672" x2="118" y2="622" stroke="url(#goldEdge)" stroke-width="1.2"/>
    <line x1="400" y1="685" x2="118" y2="642" stroke="#252d3a" stroke-width="1"/>

    <line x1="400" y1="645" x2="682" y2="585" stroke="url(#goldWarm)" stroke-width="2"/>
    <line x1="400" y1="658" x2="682" y2="602" stroke="#1d424b" stroke-width="1.2"/>
    <line x1="400" y1="672" x2="682" y2="622" stroke="url(#goldEdge)" stroke-width="1.2"/>
    <line x1="400" y1="685" x2="682" y2="642" stroke="#252d3a" stroke-width="1"/>

    <!-- Bottom center spine notch / foot -->
    <path d="M 355,688 C 375,720 425,720 445,688 C 430,696 370,696 355,688 Z" fill="#080a0d" stroke="#151922" stroke-width="2"/>
    <path d="M 368,695 C 385,712 415,712 432,695" stroke="url(#goldWarm)" stroke-width="1.8" fill="none" opacity="0.85"/>
  </g>

  <!-- ================= MAIN OPEN BOOK - LEFT WING ================= -->
  <g id="leftPageFacets" stroke="#06070a" stroke-width="0.75" stroke-linejoin="round">
    <!-- Facet L1 (Top Outer Peak) -->
    <polygon points="175,80 145,140 240,230" fill="url(#facetHighlight)"/>
    
    <!-- Facet L2 (Top Crest toward center) -->
    <polygon points="175,80 240,230 400,200" fill="url(#facetMid)"/>

    <!-- Facet L3 (Center Drop-V Triangle - sharp basalt shard) -->
    <polygon points="400,200 240,230 380,630" fill="url(#facetDark)"/>

    <!-- Facet L4 (Spine crease facet) -->
    <polygon points="400,200 380,630 400,645" fill="#0a0c10"/>

    <!-- Facet L5 (Mid Outer Facet) -->
    <polygon points="145,140 145,350 240,230" fill="url(#facetMidDark)"/>

    <!-- Facet L6 (Central Lower Broad Facet) -->
    <polygon points="240,230 145,350 250,520 380,630" fill="url(#facetSlate)"/>

    <!-- Facet L7 (Lower Left Edge Facet) -->
    <polygon points="145,350 145,585 250,520" fill="url(#facetMidDark)"/>

    <!-- Facet L8 (Bottom Fan Slope Facet) -->
    <polygon points="250,520 145,585 380,630" fill="url(#facetDark)"/>
  </g>

  <!-- ================= MAIN OPEN BOOK - RIGHT WING ================= -->
  <g id="rightPageFacets" stroke="#06070a" stroke-width="0.75" stroke-linejoin="round">
    <!-- Facet R1 (Top Outer Peak) -->
    <polygon points="625,80 655,140 560,230" fill="url(#facetSlate)"/>

    <!-- Facet R2 (Top Crest toward center) -->
    <polygon points="625,80 560,230 400,200" fill="url(#facetHighlight)"/>

    <!-- Facet R3 (Narrow Tall Shard along center) -->
    <polygon points="400,200 455,245 420,630 400,645" fill="url(#facetDark)"/>

    <!-- Facet R4 (Mid Center Triangle) -->
    <polygon points="400,200 560,230 455,245" fill="url(#facetMidDark)"/>

    <!-- Facet R5 (Mid Outer Facet) -->
    <polygon points="655,140 655,350 560,230" fill="url(#facetMid)"/>

    <!-- Facet R6 (Long Slender Facet) -->
    <polygon points="455,245 560,230 520,535 420,630" fill="url(#facetDark)"/>

    <!-- Facet R7 (Lower Outer Facet) -->
    <polygon points="560,230 655,350 655,585 520,535" fill="url(#facetSlate)"/>

    <!-- Facet R8 (Bottom Fan Slope Facet) -->
    <polygon points="520,535 655,585 420,630" fill="url(#facetMidDark)"/>
  </g>

  <!-- ================= GOLD VEINS & KINTSUGI-STYLE LINES ================= -->
  <g id="goldVeins" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Major Gold Fracture -->
    <line x1="175" y1="80" x2="240" y2="230" stroke="url(#goldWarm)" stroke-width="2.6"/>
    <line x1="240" y1="230" x2="380" y2="630" stroke="url(#goldBright)" stroke-width="2.8"/>
    <line x1="145" y1="350" x2="250" y2="520" stroke="url(#goldWarm)" stroke-width="2.2"/>
    <line x1="250" y1="520" x2="380" y2="630" stroke="url(#goldBright)" stroke-width="2.0"/>
    <line x1="145" y1="140" x2="240" y2="230" stroke="url(#goldWarm)" stroke-width="1.8" opacity="0.85"/>

    <!-- Right Major Gold Fracture -->
    <line x1="625" y1="80" x2="455" y2="245" stroke="url(#goldWarm)" stroke-width="2.4"/>
    <line x1="455" y1="245" x2="520" y2="535" stroke="url(#goldBright)" stroke-width="2.8"/>
    <line x1="520" y1="535" x2="655" y2="585" stroke="url(#goldWarm)" stroke-width="2.0"/>
    <line x1="455" y1="245" x2="420" y2="630" stroke="url(#goldWarm)" stroke-width="1.8" opacity="0.85"/>

    <!-- Subtle Cyan Mineral Vein on Right Wing -->
    <line x1="560" y1="230" x2="520" y2="535" stroke="url(#cyanAccent)" stroke-width="1.6" opacity="0.75"/>
    <line x1="520" y1="535" x2="420" y2="630" stroke="url(#cyanAccent)" stroke-width="1.4" opacity="0.6"/>

    <!-- Book Page Perimeter Gold Highlights -->
    <polyline points="400,200 175,80 145,140" stroke="url(#goldBright)" stroke-width="2.6" fill="none"/>
    <polyline points="400,200 625,80 655,140" stroke="url(#goldBright)" stroke-width="2.6" fill="none"/>

    <!-- Center Spine Crease Line -->
    <line x1="400" y1="200" x2="400" y2="645" stroke="url(#goldWarm)" stroke-width="2.2" opacity="0.9"/>
  </g>

  <!-- ================= BASALT TEXTURE PARTICLES (SPARKLES / ACCENTS) ================= -->
  <g id="sparkles" fill="url(#goldBright)">
    <!-- Stars -->
    <polygon points="175,190 178,198 186,201 178,204 175,212 172,204 164,201 172,198" opacity="0.85"/>
    <polygon points="565,550 567,556 573,558 567,560 565,566 563,560 557,558 563,556" opacity="0.6"/>
    
    <!-- Dust flecks -->
    <circle cx="210" cy="140" r="1.6" fill="#ffe48f" opacity="0.7"/>
    <circle cx="330" cy="165" r="1.8" fill="#e5c158" opacity="0.8"/>
    <circle cx="280" cy="380" r="1.3" fill="#ffffff" opacity="0.6"/>
    <circle cx="490" cy="340" r="1.5" fill="#e5c158" opacity="0.7"/>
    <circle cx="610" cy="280" r="1.3" fill="#3ddbd9" opacity="0.75"/>
  </g>
</svg>
